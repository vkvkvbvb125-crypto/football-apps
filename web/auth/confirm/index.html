<!DOCTYPE html>
<!--
  가입 확인 메일의 착지 페이지.

  ── 왜 있나 ────────────────────────────────────────────────────────
  전에는 확인 메일의 redirect_to가 `kickday://auth-callback`이었다. 커스텀 스킴이라
  **브라우저가 열 수 있는 주소가 아니다** — 폰에서는 앱이 열리지만 데스크톱에서는
  흰 화면이 뜬다. 확인 처리 자체는 그 앞에서 Supabase가 끝내므로 "무해한 흰 화면"인데,
  사용자 눈에는 「가입했는데 아무 일도 안 일어났다」다.

  ⚠ 흰 화면의 원인은 셋이고 **출력이 같다**:
      ① 페이지가 없다(404가 흰색으로 보인다)
      ② 페이지는 있는데 스크립트가 던졌다
      ③ **주소 자체가 브라우저가 열 수 없는 스킴이다**   ← 이 건이 그것이었다
    셋을 안 가르면 "페이지를 만들면 되겠지"로 가는데, ③은 페이지를 만들어도
    **주소를 안 바꾸면 그대로다.** 그래서 app 쪽 emailRedirectTo를 이 URL로 바꿔야 한다.

  ── 무엇을 하지 않는가 ────────────────────────────────────────────
  ⚠ **앱으로 자동 이동하지 않는다.** 그러면 데스크톱에서 흰 화면이 그대로 돌아온다.
    결과를 먼저 글로 보여주고, 앱 열기는 **버튼**으로 둔다.
    (web/auth/naver/index.html은 자동 이동이 맞다 — 거기는 폰에서만 열리는 흐름이다)

  ⚠ **키를 쓰지 않는다.** 확인은 Supabase가 이 페이지에 오기 **전에** 이미 끝냈다.
    이 페이지는 결과를 읽어서 말해 줄 뿐이라 anon key도 fetch도 필요 없다 —
    저장소 규칙(키를 커밋에 넣지 않는다)과도 부딪히지 않는다.
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KickDay 가입 확인</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #07100d;
        color: #e7ece9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 24px;
      }
      .card { max-width: 420px; width: 100%; text-align: center; }
      .mark { font-size: 44px; line-height: 1; margin-bottom: 18px; }
      h1 { font-size: 20px; margin: 0 0 10px; }
      p { font-size: 15px; line-height: 1.6; color: #a8b3ad; margin: 0 0 22px; }
      .btn {
        display: block;
        padding: 15px 20px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        margin-top: 10px;
      }
      .btn-primary { background: #22c55e; color: #06130c; }
      .btn-ghost { border: 1px solid #2a3a32; color: #e7ece9; }
      .hint { font-size: 13px; color: #6f7c75; margin-top: 18px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" id="mark">⏳</div>
      <h1 id="title">확인하는 중…</h1>
      <p id="desc"></p>
      <div id="actions"></div>
      <div class="hint" id="hint"></div>
    </div>

    <script>
      (function () {
        /*
          Supabase는 결과를 쿼리(?)에도 프래그먼트(#)에도 싣는다 — 흐름과 버전에 따라
          갈린다. 한쪽만 읽으면 성공을 실패로 읽는 날이 온다. 둘을 합쳐서 본다.
        */
        function params() {
          var out = {};
          [window.location.search, window.location.hash].forEach(function (raw) {
            if (!raw || raw.length < 2) return;
            raw
              .slice(1)
              .split('&')
              .forEach(function (pair) {
                if (!pair) return;
                var i = pair.indexOf('=');
                var k = i < 0 ? pair : pair.slice(0, i);
                var v = i < 0 ? '' : pair.slice(i + 1);
                out[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' '));
              });
          });
          return out;
        }

        var p = params();
        var APP_URL = 'kickday://auth-callback';
        var ua = navigator.userAgent || '';
        var isIOS = /iPad|iPhone|iPod/.test(ua);
        var isAndroid = /Android/.test(ua);
        var isMobile = isIOS || isAndroid;
        var STORE = isIOS
          ? 'https://apps.apple.com/app/id0000000000'
          : 'https://play.google.com/store/apps/details?id=com.kickday.app';

        function render(mark, title, desc, actions, hint) {
          document.getElementById('mark').textContent = mark;
          document.getElementById('title').textContent = title;
          document.getElementById('desc').innerHTML = desc;
          document.getElementById('actions').innerHTML = actions;
          document.getElementById('hint').innerHTML = hint || '';
        }

        var openApp =
          '<a class="btn btn-primary" href="' + APP_URL + '">앱에서 열기</a>';
        /*
          앱이 없을 때. 데스크톱에서는 스토어로 보내 봐야 소용이 없어서 말로 안내한다 —
          web/index.html이 같은 방식이다(거기는 폰만 오므로 스토어 버튼만 둔다).
        */
        var getApp = isMobile
          ? '<a class="btn btn-ghost" href="' + STORE + '">앱 설치하기</a>'
          : '';
        var deskHint = isMobile
          ? ''
          : '휴대폰에서 KickDay 앱을 열고 로그인하세요.';

        if (p.error || p.error_code) {
          /*
            ⚠ **만료와 「이미 확인됨」을 가를 수 없다.** Supabase는 둘 다
              `otp_expired` / `access_denied`로 돌려준다 — 한 번 쓴 링크와 시간이 지난
              링크가 서버 입장에서 같은 상태라서다. 그래서 **둘 다 맞는 문구**를 쓴다.
              「만료됐어요」라고만 하면, 이미 확인된 사람이 멀쩡한 계정을 버리고
              다시 가입한다.
            ⚠ 재발송 버튼을 여기 두지 않았다. 누구의 메일인지 이 URL에 안 실려 있어서
              이메일을 다시 받아야 하고, 그러려면 이 페이지가 키를 들고 있어야 한다.
              **앱에 재발송이 없는 것이 진짜 구멍**이고 그건 따로 고친다(서랍).
          */
          render(
            '⚠️',
            '링크를 쓸 수 없어요',
            '이미 확인을 마쳤거나, 링크가 만료됐어요.<br />' +
              '<b>먼저 앱에서 로그인해 보세요</b> — 이미 확인된 계정이면 그대로 들어갑니다.',
            openApp + getApp,
            deskHint +
              (deskHint ? '<br />' : '') +
              '로그인이 안 되면 가입을 다시 진행해 주세요.'
          );
          return;
        }

        if (p.access_token || p.refresh_token || p.token_hash || p.type) {
          render(
            '✅',
            '가입이 확인됐어요',
            '이제 KickDay 앱에서 로그인할 수 있어요.',
            openApp + getApp,
            deskHint
          );
          return;
        }

        /*
          아무 값도 없이 이 주소로 온 경우 — 메일을 거치지 않고 직접 들어왔거나
          중간에서 파라미터가 떨어졌다. **성공이라고 말하지 않는다.**
          여기서 「확인됐어요」라고 하면 안 된 것을 됐다고 하는 셈이다.
        */
        render(
          '✉️',
          '확인 정보가 없어요',
          '가입 확인 메일의 링크로 들어와 주세요.<br />' +
            '메일을 못 받으셨다면 스팸함도 확인해 주세요.',
          openApp,
          deskHint
        );
      })();
    </script>
  </body>
</html>
