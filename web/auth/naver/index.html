<!DOCTYPE html>
<!--
  네이버 로그인 콜백 중계.

  네이버는 Callback URL에 http/https만 받는다. 앱은 kickday:// 스킴으로 돌아와야 해서
  둘이 만나지 않는다. 이 페이지가 https로 받아 스킴으로 넘겨준다.

  Supabase Edge Function으로도 되지만(invite-redirect가 그 방식), 이 도메인은 이미
  정적 사이트를 배포하고 있어서 파일 하나면 끝난다 — 함수 하나를 덜 굴린다.
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KickDay 로그인</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #07100d;
        color: #e7ece9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      p { font-size: 15px; font-weight: 600; }
      a { color: #4ade80; }
    </style>
  </head>
  <body>
    <p id="msg">앱으로 돌아가는 중…</p>
    <script>
      // 네이버가 붙여 보낸 code·state·error를 그대로 앱에 넘긴다.
      // 값을 여기서 해석하지 않는다 — 검증은 앱과 Edge Function이 한다.
      var target = 'kickday://auth-callback' + (window.location.search || '');
      window.location.replace(target);

      // 앱이 안 깔렸거나 스킴이 안 열리면 이 페이지에 그대로 남는다.
      setTimeout(function () {
        document.getElementById('msg').innerHTML =
          '앱이 열리지 않았어요.<br /><a href="' + target + '">다시 시도</a>';
      }, 2000);
    </script>
  </body>
</html>
