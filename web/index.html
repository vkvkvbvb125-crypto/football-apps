<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KickDay — 우리 팀의 매주 그 시간</title>
    <meta name="description" content="풋살 모임 운영을 돕는 앱. 참석 투표, 팀 분배, 회비 정산까지." />
    <meta property="og:title" content="KickDay" />
    <meta property="og:description" content="풋살 모임 운영을 돕는 앱" />
    <style>
      :root {
        --bg: #07100d;
        --card: #101a16;
        --border: #1d2a24;
        --text: #e8f0ec;
        --dim: #8fa69c;
        --green: #4ade80;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      }
      main { width: 100%; max-width: 380px; text-align: center; }
      .brand { font-size: 34px; font-weight: 800; letter-spacing: -1px; margin: 0 0 6px; }
      .brand span { color: var(--green); }
      .tagline { color: var(--dim); font-size: 14px; margin: 0 0 32px; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 24px 20px;
        text-align: left;
      }
      .card h2 { font-size: 16px; margin: 0 0 8px; }
      .card p { color: var(--dim); font-size: 13.5px; line-height: 1.6; margin: 0 0 18px; }
      .btn {
        display: block;
        padding: 15px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 700;
        text-align: center;
        text-decoration: none;
        margin-bottom: 10px;
      }
      .btn-primary { background: var(--green); color: var(--bg); }
      .btn-ghost { border: 1px solid var(--border); color: var(--text); }
      .note { color: #5f6b66; font-size: 12px; line-height: 1.6; margin: 18px 0 0; }
      footer { margin-top: 28px; font-size: 12px; }
      footer a { color: var(--dim); text-decoration: none; margin: 0 8px; }
    </style>
  </head>
  <body>
    <main>
      <h1 class="brand"><span>Kick</span>Day</h1>
      <p class="tagline">우리 팀의 매주 그 시간</p>

      <div class="card">
        <h2 id="title">앱에서 열어주세요</h2>
        <p id="desc">
          이 링크는 KickDay 앱에서 열립니다. 앱이 설치되어 있으면 자동으로 열리고, 없으면 아래에서 설치할 수 있어요.
        </p>

        <a class="btn btn-primary" id="open" href="#">앱에서 열기</a>
        <a class="btn btn-ghost" id="store" href="#">앱 설치하기</a>

        <p class="note">
          설치를 마치셨나요? 카카오톡으로 돌아가 링크를 한 번 더 눌러주세요.<br />
          설치 직후에는 어떤 링크로 오셨는지 앱이 알 수 없어요.
        </p>
      </div>

      <footer>
        <a href="/terms">이용약관</a>
        <a href="/privacy">개인정보처리방침</a>
      </footer>
    </main>

    <script>
      // 앱 스킴으로 한 번 열어본다.
      // 유니버설 링크가 걸려 있으면 이 페이지에 오기 전에 앱이 열리므로, 여기까지 왔다는 건
      // (1) 앱이 없거나 (2) 유니버설 링크가 아직 검증되지 않았다는 뜻이다. 그래도 스킴은 시도해본다.
      var path = location.pathname.replace(/^\/+/, '');
      var appUrl = 'kickday://' + path + location.search;

      var STORE = {
        ios: 'https://apps.apple.com/app/id[APP_STORE_ID]',
        android: 'https://play.google.com/store/apps/details?id=com.kickday.app',
      };
      var ua = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua);
      var storeUrl = isIOS ? STORE.ios : STORE.android;

      document.getElementById('open').href = appUrl;
      document.getElementById('store').href = storeUrl;

      // 정산 링크로 들어온 경우엔 무엇을 하러 왔는지 알려준다
      if (/^s\//.test(path)) {
        document.getElementById('title').textContent = '정산 내역을 확인하세요';
        document.getElementById('desc').textContent =
          'KickDay 앱에서 이 경기의 정산 내역과 내가 낼 금액을 볼 수 있어요.';
      }

      // 자동 실행은 하지 않는다 — 앱이 없는 기기에서 "페이지를 열 수 없습니다" 경고창만 뜬다.
      // 사용자가 버튼을 눌러 의사를 밝혔을 때만 시도한다.
    </script>
  </body>
</html>
